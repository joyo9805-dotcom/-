<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>우리의 전국 동네 정복 지도</title>
    
    <!-- 네이버 지도 API -->
    <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=6dnj1t3omk"></script>
    
    <!-- Firebase 실시간 데이터베이스 SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f8f9fa;
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 상단 대시보드 */
        .dashboard {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            padding: 14px 18px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            min-width: 240px;
        }

        .dashboard h1 {
            font-size: 15px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .dashboard-header-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sync-badge {
            font-size: 11px;
            background-color: #e6fcf5;
            color: #0ca678;
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: 600;
        }

        .btn-history-open {
            font-size: 11px;
            background: #fff0f3;
            color: #ff3366;
            border: 1px solid #ffccd5;
            padding: 2px 7px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
        }

        .dashboard .stat-box {
            display: flex;
            align-items: baseline;
            gap: 6px;
            margin-bottom: 8px;
        }

        .dashboard .stat-num {
            font-size: 22px;
            font-weight: 800;
            color: #ff3366;
        }

        .dashboard .stat-total {
            font-size: 13px;
            color: #888;
        }

        .dashboard .progress-bar {
            width: 100%;
            height: 6px;
            background-color: #eee;
            border-radius: 4px;
            overflow: hidden;
        }

        .dashboard .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff758c 0%, #ff3366 100%);
            transition: width 0.4s ease;
        }

        /* 방문 횟수 범례 */
        .legend-card {
            position: absolute;
            right: 16px;
            bottom: 24px;
            z-index: 90;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(6px);
            padding: 10px 14px;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            font-size: 11px;
            color: #495057;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: none;
        }
        .legend-title {
            font-weight: 700;
            margin-bottom: 2px;
            color: #212529;
        }

            width: 130px;
            height: 8px;

            background: linear-gradient(90deg, #ffccd5 0
